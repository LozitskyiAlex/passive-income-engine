name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Configure calculator
    env:
      SITE_BASE_URL: https://passive-income-engine.oleksoleks07.workers.dev
      INDEX_NOW_KEY: ${{ secrets.INDEX_NOW_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Run tests before build
        env:
          INDEX_NOW_KEY: ci-test-indexnow-key
        run: pytest

      - name: Build production site
        env:
          INDEX_NOW_KEY: ${{ secrets.INDEX_NOW_KEY }}
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          python scripts/build.py
          python scripts/build_calculators.py
          python scripts/build_construction.py
          python scripts/build_construction_index.py
          python scripts/build_seo.py

      - name: Validate generated site
        run: pytest tests/test_generated_site.py -q

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Smoke test production deployment
        run: python scripts/smoke_test.py

      - name: Verify IndexNow key file
        if: ${{ env.INDEX_NOW_KEY != '' }}
        continue-on-error: true
        run: |
          set -e
          KEY_URL="$SITE_BASE_URL/${INDEX_NOW_KEY}.txt"
          test -f "site/${INDEX_NOW_KEY}.txt"
          test "$(cat "site/${INDEX_NOW_KEY}.txt")" = "${INDEX_NOW_KEY}"
          body="$(curl -fsS --max-time 15 "$KEY_URL")"
          test "$body" = "${INDEX_NOW_KEY}"
          echo "IndexNow key file is publicly reachable and correct."

      - name: Submit sitemap to IndexNow
        if: ${{ env.INDEX_NOW_KEY != '' }}
        continue-on-error: true
        run: python scripts/submit_indexnow.py
