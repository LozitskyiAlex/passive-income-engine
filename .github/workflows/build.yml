name: Build and validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: https://passive-income-engine.oleksoleks07.workers.dev
      INDEX_NOW_KEY: ci-test-indexnow-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

      - name: Build production site
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          python scripts/build.py
          python scripts/build_calculators.py
          python scripts/build_construction.py
          python scripts/build_construction_index.py
          python scripts/build_seo.py

      - name: Validate generated site
        run: pytest tests/test_generated_site.py -q

      - name: Validate production packaging
        run: |
          test -f wrangler.jsonc
          test -f site/index.html
          test -f site/404.html
          test -f site/robots.txt
          test -f site/sitemap.xml
          test -f site/deployment-version.txt

      # Production deployment is intentionally not performed here.
      # Cloudflare Git integration deploys the main branch automatically.
