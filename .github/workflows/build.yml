name: Build static product

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python scripts/build.py
      - run: python scripts/build_calculators.py
      - run: python scripts/build_construction.py
      - run: python scripts/build_construction_index.py
      - run: python scripts/build_seo.py
      - run: echo "$GITHUB_SHA" > site/deployment-version.txt
      - run: find site -type f | sort

      - name: Wait for Cloudflare deployment
        env:
          DEPLOYMENT_URL: https://passive-income-engine.oleksoleks07.workers.dev
        run: |
          set -e
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 "$DEPLOYMENT_URL/deployment-version.txt?sha=$GITHUB_SHA" | grep -Fxq "$GITHUB_SHA"; then
              echo "Cloudflare deployment confirmed for $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for Cloudflare deployment ($i/36)..."
            sleep 10
          done
          echo "Cloudflare deployment was not confirmed within 6 minutes."
          exit 1

      - name: Verify IndexNow key file
        env:
          KEY: 1bd47cdd1ffc5c4b2caa7e4d4cc3397c
          KEY_URL: https://passive-income-engine.oleksoleks07.workers.dev/1bd47cdd1ffc5c4b2caa7e4d4cc3397c.txt
        run: |
          set -e
          body="$(curl -fsS --max-time 10 "$KEY_URL?sha=$GITHUB_SHA")"
          if [ "$body" != "$KEY" ]; then
            echo "IndexNow key file content mismatch."
            printf 'Received: <%s>\n' "$body"
            exit 1
          fi
          echo "IndexNow key file is publicly reachable and correct."

      - name: Submit sitemap to IndexNow
        run: python scripts/submit_indexnow.py
        # IndexNow runs only after the deployed commit and key file are verified.
