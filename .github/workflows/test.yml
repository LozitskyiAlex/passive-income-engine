name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INDEX_NOW_KEY: test-indexnow-key-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest
      - name: Build generated site
        env:
          WORKERS_CI_COMMIT_SHA: test
        run: |
          python scripts/build.py
          python scripts/build_calculators.py
          python scripts/build_construction.py
          python scripts/build_construction_index.py
          python scripts/build_seo.py
      - name: Validate generated site
        run: pytest tests/test_generated_site.py -q
